{% for publication in site.data.publications %}
  <div class="publication">
    <h3>{{ publication.title }}</h3>
    <p>{{ publication.author | join: ", " }}</p>
    <a href="{{ publication.html }}">Details</a>
    {% if publication.image %}
      <img src="{{ site.baseurl }}{{ publication.image }}" alt="{{ publication.title }}">
    {% endif %}
  </div>
{% endfor %}
